## ═══════════════════════════════════════════════════════════════
## openvibe.work — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.work.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 4960, systemd unit openvibe-work) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in and the API, and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=work_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=work_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=work_forms:10m rate=1r/s;
# Saved-search writes only: reads of /saved get an empty key, which nginx does not count (limit_req is not allowed
# inside limit_except).
map $request_method $work_saved_write_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $work_saved_write_key zone=work_saved_writes:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.work www.openvibe.work;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.work$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.work;

    ssl_certificate     /etc/letsencrypt/live/openvibe.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.work;

    ssl_certificate     /etc/letsencrypt/live/openvibe.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.work.access.log;
    error_log  /var/log/nginx/openvibe.work.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=work_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4960;
    }

    location /auth/ {
        limit_req zone=work_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4960;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=work_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4960;
    }

    # ── Forms and other writes ──────────────────────────────
    location ~ ^/forms {
        limit_req zone=work_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4960;
    }

    # Saving or forgetting a saved search is a write made with a session cookie: the strict form zone, but reading
    # /saved is an ordinary page and keeps the page budget (the browser reloads it freely).
    location ~ ^/saved(/[A-Za-z0-9_-]+/delete)?$ {
        limit_req zone=work_saved_writes burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4960;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4960/metrics) ──
    location = /metrics { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:4960;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
